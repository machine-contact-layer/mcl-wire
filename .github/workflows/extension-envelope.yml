name: Extension envelope conformance

on:
  push:
    paths:
      - "research/extensions/**"
      - "research/extension-envelope-v0.1.md"
      - ".github/workflows/extension-envelope.yml"
  pull_request:
    paths:
      - "research/extensions/**"
      - "research/extension-envelope-v0.1.md"
      - ".github/workflows/extension-envelope.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run extension-envelope tests
        run: python test_extension_envelope.py
