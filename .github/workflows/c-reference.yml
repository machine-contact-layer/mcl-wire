name: C reference

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C99 build
        run: >-
          cmake -S . -B build
          -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Wundef -Werror"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Reproduce source benchmark
        run: ./build/mcl_wire_benchmark_source
      - name: Sanitizer decoder stress test
        run: >-
          clang -std=c99 -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion
          -Wshadow -Wundef -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
          -Iinclude src/wire.c tests/test_fuzz_decode.c -o fuzz-sanitized
          && ./fuzz-sanitized

  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cortex-M0 compile
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m0 -mthumb -std=c99 -Os -ffreestanding -fno-builtin -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Wundef -Werror -Iinclude -c src/wire.c -o wire-m0.o
          clang --target=arm-none-eabi -mcpu=cortex-m0 -mthumb -std=c99 -Os -ffreestanding -fno-builtin -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Wundef -Werror -Iinclude -c src/extension.c -o extension-m0.o
      - name: RV32IM compile
        run: |
          clang --target=riscv32-none-elf -march=rv32im -mabi=ilp32 -std=c99 -Os -ffreestanding -fno-builtin -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Wundef -Werror -Iinclude -c src/wire.c -o wire-rv32.o
          clang --target=riscv32-none-elf -march=rv32im -mabi=ilp32 -std=c99 -Os -ffreestanding -fno-builtin -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Wundef -Werror -Iinclude -c src/extension.c -o extension-rv32.o
      - name: Check no required external runtime symbols
        run: |
          test -z "$(nm -u wire-m0.o)"
          test -z "$(nm -u extension-m0.o)"
          test -z "$(nm -u wire-rv32.o)"
          test -z "$(nm -u extension-rv32.o)"
